# Netlify: web estática, sin paso de build. Se publica la carpeta raíz.
[build]
  publish = "."

# Las versiones ?v= en index.html cambian con cada edición, así que
# CSS, JS e imágenes pueden cachearse mucho; el HTML se revalida siempre.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
